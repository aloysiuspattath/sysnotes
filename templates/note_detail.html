<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SysNotes — Loading…</title>
    <meta name="description" content="Sysadmin note detail view">
    <style>
        /* ── Reset & tokens ─────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f2f4f7;
            --surface: #fafbfc;
            --border: #e4e8ef;
            --text: #2d3748;
            --text-2: #718096;
            --text-3: #a0aec0;
            --accent: #6366f1;
            --accent-s: rgba(99,102,241,0.09);
            --accent-b: rgba(99,102,241,0.3);
            --green: #38a169;
            --green-s: rgba(56,161,105,0.09);
            --green-b: rgba(56,161,105,0.3);
            --code-bg: #1a202c;
            --code-text: #68d391;
            --shadow: 0 1px 4px rgba(45,55,72,0.08), 0 0 0 1px rgba(45,55,72,0.04);
            --shadow-lg: 0 8px 32px rgba(45,55,72,0.14);
            --r: 10px;
            --r-lg: 14px;
            --r-full: 9999px;
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --mono: 'SF Mono','Cascadia Code','Fira Code',Consolas,monospace;
        }
                [data-theme="dark"] {
            --bg: #0a0a0f;
            --surface: #14141d;
            --border: #27272a;
            --text: #fafafa;
            --text-2: #a1a1aa;
            --text-3: #71717a;
            --accent: #a855f7;
            --accent-s: rgba(168,85,247,0.12);
            --accent-b: rgba(168,85,247,0.45);
            --green: #10b981;
            --green-s: rgba(16,185,129,0.1);
            --green-b: rgba(16,185,129,0.35);
            --code-bg: #09090b;
            --code-text: #4ade80;
            --shadow: 0 4px 20px rgba(0,0,0,0.4);
            --shadow-lg: 0 12px 30px rgba(0,0,0,0.5);
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Top bar ─────────────────────────────────────── */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            height: 58px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow);
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 14px;
            border: 1px solid var(--border);
            border-radius: var(--r);
            background: transparent;
            color: var(--text-2);
            font-size: 0.83rem;
            font-weight: 500;
            font-family: var(--font);
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s ease;
        }
        .back-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-s);
        }

        .topbar-logo {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.02em;
            text-decoration: none;
        }
        .topbar-logo span { color: var(--accent); }

        .topbar-right { display: flex; align-items: center; gap: 10px; }

        .theme-btn {
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: var(--r);
            background: transparent;
            color: var(--text-2);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s;
        }
        .theme-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-s); }

        /* ── Loading spinner ─────────────────────────────── */
        .spinner-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 40vh;
            flex-direction: column;
            gap: 14px;
            color: var(--text-3);
        }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Main layout ─────────────────────────────────── */
        .page {
            max-width: 860px;
            margin: 0 auto;
            padding: 36px 24px 80px;
        }

        /* ── Note header card ────────────────────────────── */
        .note-header-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            padding: 28px 32px 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .note-header-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent) 0%, #a78bfa 100%);
        }
        .note-header-card.is-procedure::before {
            background: linear-gradient(90deg, var(--green) 0%, #6ee7b7 100%);
        }

        .note-type-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: var(--r-full);
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            margin-bottom: 14px;
        }
        .note-type-badge.command { background: var(--accent-s); color: var(--accent); border: 1px solid var(--accent-b); }
        .note-type-badge.procedure { background: var(--green-s); color: var(--green); border: 1px solid var(--green-b); }
        .note-type-badge .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 6px currentColor;
        }

        .note-title {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.03em;
            line-height: 1.25;
            margin-bottom: 10px;
        }

        .note-description {
            font-size: 0.95rem;
            color: var(--text-2);
            line-height: 1.65;
            margin-bottom: 18px;
        }

        .note-meta-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .meta-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: var(--r-full);
            font-size: 0.7rem;
            font-weight: 600;
        }
        .meta-badge.category { background: var(--accent-s); color: var(--accent); text-transform: uppercase; letter-spacing: 0.4px; }
        .meta-badge.tag { background: var(--accent-s); color: var(--accent); border: 1px solid var(--accent-b); }
        .meta-badge.author { background: transparent; color: var(--text-3); margin-left: auto; }

        /* ── Command block ───────────────────────────────── */
        .command-block {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            padding: 0;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .command-block-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
        }

        .command-block-label span {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-3);
        }

        .copy-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            border: 1px solid var(--accent-b);
            border-radius: var(--r);
            background: var(--accent-s);
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: 600;
            font-family: var(--font);
            cursor: pointer;
            transition: all 0.15s;
        }
        .copy-btn:hover { background: var(--accent); color: #fff; }
        .copy-btn.copied { background: rgba(52,211,153,0.15); color: #34d399; border-color: rgba(52,211,153,0.4); }

        pre.code-body {
            margin: 0;
            padding: 18px 22px;
            background: var(--code-bg);
            color: var(--code-text);
            font-family: var(--mono);
            font-size: 0.875rem;
            line-height: 1.7;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* ── Procedure steps ─────────────────────────────── */
        .steps-title {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-3);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .steps-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .step-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            overflow: hidden;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            animation: fadeUp 0.35s ease backwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .step-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 20px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }

        .step-num {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px; height: 30px;
            border-radius: 50%;
            background: var(--green-s);
            border: 1.5px solid var(--green-b);
            color: var(--green);
            font-size: 0.8rem;
            font-weight: 800;
            flex-shrink: 0;
        }

        .step-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.01em;
        }

        .step-body {
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .step-desc {
            font-size: 0.88rem;
            color: var(--text-2);
            line-height: 1.65;
        }

        .step-command {
            border-radius: var(--r);
            overflow: hidden;
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
        }

        .step-command-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }
        .step-command-header span {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-3);
        }

        pre.step-code {
            margin: 0;
            padding: 14px 16px;
            background: var(--code-bg);
            color: var(--code-text);
            font-family: var(--mono);
            font-size: 0.83rem;
            line-height: 1.65;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* ── Step images ─────────────────────────────────── */
        .step-images {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .step-image-thumb {
            width: 100px; height: 100px;
            border-radius: var(--r);
            overflow: hidden;
            border: 1px solid var(--border);
            cursor: zoom-in;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .step-image-thumb:hover { transform: scale(1.05); box-shadow: var(--shadow-lg); }
        .step-image-thumb img { width: 100%; height: 100%; object-fit: cover; }

        /* ── Lightbox ────────────────────────────────────── */
        .lightbox {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
            animation: fadeIn 0.15s ease;
            backdrop-filter: blur(8px);
        }
        .lightbox img {
            max-width: 92vw; max-height: 90vh;
            border-radius: var(--r-lg);
            box-shadow: 0 30px 80px rgba(0,0,0,0.7);
        }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

        /* ── Note-level images ───────────────────────────── */
        .note-images-section { margin-top: 24px; }
        .note-images-grid { display: flex; flex-wrap: wrap; gap: 10px; }
        .note-image-thumb {
            width: 100px; height: 100px;
            border-radius: var(--r);
            overflow: hidden;
            border: 1px solid var(--border);
            cursor: zoom-in;
            transition: transform 0.15s;
        }
        .note-image-thumb:hover { transform: scale(1.05); }
        .note-image-thumb img { width: 100%; height: 100%; object-fit: cover; }

        /* ── Responsive ──────────────────────────────────── */
        @media (max-width: 600px) {
            .page { padding: 20px 14px 60px; }
            .note-title { font-size: 1.3rem; }
            .topbar { padding: 0 16px; }
            pre.code-body, pre.step-code { font-size: 0.78rem; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-left">
            <a href="/" class="back-btn" id="back-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                Back
            </a>
            <a href="/" class="topbar-logo">Sys<span>Notes</span></a>
        </div>
        <div class="topbar-right">
            <button class="theme-btn" id="theme-btn">☀ Light</button>
        </div>
    </header>

    <main class="page" id="page-content">
        <div class="spinner-wrap" id="spinner">
            <div class="spinner"></div>
            <span>Loading note…</span>
        </div>
    </main>

    <script>
    (function() {
        'use strict';

        // ── Theme ────────────────────────────────────────
        const saved = localStorage.getItem('sn_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', saved);
        const themeBtn = document.getElementById('theme-btn');
        themeBtn.textContent = saved === 'dark' ? '☀ Light' : '🌙 Dark';
        themeBtn.addEventListener('click', () => {
            const cur = document.documentElement.getAttribute('data-theme');
            const next = cur === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('sn_theme', next);
            themeBtn.textContent = next === 'dark' ? '☀ Light' : '🌙 Dark';
        });

        // ── Helpers ──────────────────────────────────────
        function esc(str) {
            if (str == null) return '';
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function copyText(text, btn) {
            const orig = btn.innerHTML;
            navigator.clipboard.writeText(text).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = text; ta.style.opacity = '0'; ta.style.position = 'fixed';
                document.body.appendChild(ta); ta.select(); document.execCommand('copy');
                document.body.removeChild(ta);
            });
            btn.innerHTML = '✓';
            btn.classList.add('copied');
            setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('copied'); }, 2000);
        }

        function openLightbox(src) {
            const box = document.createElement('div');
            box.className = 'lightbox';
            box.innerHTML = `<img src="${esc(src)}" alt="">`;
            box.addEventListener('click', () => box.remove());
            document.body.appendChild(box);
            document.addEventListener('keydown', function esc(e) {
                if (e.key === 'Escape') { box.remove(); document.removeEventListener('keydown', esc); }
            });
        }

        // ── Render ───────────────────────────────────────
        function renderNote(note) {
            const isProcedure = note.note_type === 'procedure';
            const steps = note.steps || [];
            const tags = note.tags || [];
            const images = note.images || [];

            document.title = `SysNotes — ${note.title}`;

            let html = '';

            // Header card
            html += `<div class="note-header-card ${isProcedure ? 'is-procedure' : ''}">
                <div class="note-type-badge ${isProcedure ? 'procedure' : 'command'}">
                    <span class="dot"></span>
                    ${isProcedure ? 'Procedure' : 'Command'}
                </div>
                <h1 class="note-title">${esc(note.title)}</h1>
                ${note.description ? `<p class="note-description">${esc(note.description)}</p>` : ''}
                <div class="note-meta-row">
                    ${note.category_name ? `<span class="meta-badge category">📁 ${esc(note.category_name)}</span>` : ''}
                    ${tags.map(t => `<span class="meta-badge tag">#${esc(t)}</span>`).join('')}
                    <span class="meta-badge author">👤 ${esc(note.created_by_username || 'Unknown')}</span>
                </div>
            </div>`;

            if (!isProcedure && note.command) {
                // Single command block
                html += `<div class="command-block">
                    <div class="command-block-label">
                        <span>Command</span>
                        <button class="copy-btn" id="main-copy-btn">⎘</button>
                    </div>
                    <pre class="code-body"><code id="main-code">${esc(note.command)}</code></pre>
                </div>`;
            }

            // Note-level images
            if (images.length) {
                html += `<div class="note-images-section">
                    <div class="steps-title">Attachments</div>
                    <div class="note-images-grid">
                        ${images.map(img => `
                            <div class="note-image-thumb" data-src="${esc(img.url)}">
                                <img src="${esc(img.url)}" alt="${esc(img.name || '')}">
                            </div>`).join('')}
                    </div>
                </div>`;
            }

            // Procedure steps
            if (isProcedure && steps.length) {
                html += `<div class="steps-section">
                    <div class="steps-title">${steps.length} Step${steps.length !== 1 ? 's' : ''}</div>`;
                steps.forEach((step, i) => {
                    const stepImgs = step.images || [];
                    html += `<div class="step-card" style="animation-delay:${i * 0.07}s">
                        <div class="step-header">
                            <div class="step-num">${i + 1}</div>
                            <div class="step-title">${esc(step.title || 'Step ' + (i + 1))}</div>
                        </div>
                        <div class="step-body">
                            ${step.description ? `<p class="step-desc">${esc(step.description)}</p>` : ''}
                            ${step.command ? `
                                <div class="step-command">
                                    <div class="step-command-header">
                                        <span>Command</span>
                                        <button class="copy-btn step-copy-btn">⎘</button>
                                    </div>
                                    <pre class="step-code"><code>${esc(step.command)}</code></pre>
                                </div>` : ''}
                            ${stepImgs.length ? `
                                <div class="step-images">
                                    ${stepImgs.map(img => `
                                        <div class="step-image-thumb" data-src="${esc(img.url)}">
                                            <img src="${esc(img.url)}" alt="${esc(img.name || '')}">
                                        </div>`).join('')}
                                </div>` : ''}
                        </div>
                    </div>`;
                });
                html += `</div>`;
            }

            const container = document.getElementById('page-content');
            container.innerHTML = html;

            // Wire copy buttons
            const mainCopy = document.getElementById('main-copy-btn');
            if (mainCopy) {
                mainCopy.addEventListener('click', () => {
                    copyText(document.getElementById('main-code').textContent, mainCopy);
                });
            }
            container.querySelectorAll('.step-copy-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const code = btn.closest('.step-command').querySelector('code').textContent;
                    copyText(code, btn);
                });
            });

            // Lightbox
            container.querySelectorAll('[data-src]').forEach(el => {
                el.addEventListener('click', () => openLightbox(el.dataset.src));
            });
        }

        // ── Fetch & init ──────────────────────────────────
        const noteId = {{ note_id }};
        fetch('/api/notes/' + noteId)
            .then(r => {
                if (!r.ok) throw new Error('Not found');
                return r.json();
            })
            .then(renderNote)
            .catch(() => {
                document.getElementById('page-content').innerHTML =
                    `<div class="spinner-wrap"><p style="color:var(--text-2)">Note not found or an error occurred. <a href="/" style="color:var(--accent)">Go back</a></p></div>`;
            });
    })();
    </script>
</body>
</html>
